# Producción de Rifax con Docker.
#
#   docker compose -f compose.prod.yaml up -d --build
#
# Lee la configuración de .env (ver .env.production.example).
# El compose.yaml de la raíz es solo para desarrollo con Sail.

x-app: &app
  image: rifax-app:${RIFAX_IMAGE_TAG:-latest}
  env_file: ${RIFAX_ENV_FILE:-.env}
  restart: unless-stopped
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [rifax]

services:
  app:
    <<: *app
    # Solo "app" construye la imagen; worker y scheduler reutilizan rifax-app.
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Procesa la cola: envíos de WhatsApp, boletos, aprobación de pagos.
  worker:
    <<: *app
    pull_policy: never
    depends_on: [app]
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    stop_grace_period: 60s

  # Tareas programadas: vencimiento de reservas, recordatorios.
  scheduler:
    <<: *app
    pull_policy: never
    depends_on: [app]
    command: ["php", "artisan", "schedule:work"]

  web:
    image: rifax-web:${RIFAX_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Falta APP_DOMAIN en .env}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
      - "${WEB_HTTPS_PORT:-443}:443/udp"
    volumes:
      # Solo lectura: Caddy sirve los archivos públicos (boletos, logos).
      - storage:/var/www/html/storage:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks: [rifax]

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [rifax]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [rifax]

volumes:
  storage:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

networks:
  rifax:
